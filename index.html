<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHIMNEY — Discount Spin & Win</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy-deep:#7c828b;
  --navy-mid:#c7cbd1;

  --gold:#e8b93b;
  --gold-light:#ffd76a;
  --gold-dark:#9b701b;

  --ink:#2a2c30;
  --muted:#5a5e65;

  --red:#c0392b;
  --red-dark:#791d16;

  --purple:#6c3fa0;
  --orange:#d9711f;
  --green:#1e7a3d;
  --blue:#1f4fa0;
  --pink:#c22a72;
  --teal:#0e7c7b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      900px 600px at 50% -5%,
      #ccd0d5 0%,
      #a7abb3 45%,
      var(--navy-deep) 78%
    );

  font-family:'Poppins',sans-serif;
  color:var(--ink);

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:30px 16px 60px;
  overflow-x:hidden;
}

/* =========================
   BRAND
========================= */

.brand{
  text-align:center;
  margin-bottom:8px;
  position:relative;
  z-index:10;
}

.brand .kicker{
  font-size:13px;
  letter-spacing:3px;
  text-transform:lowercase;
  color:var(--muted);
  margin:8px 0 0;
}

.brand .offer{
  font-size:13px;
  letter-spacing:.5px;
  color:var(--muted);
  margin:10px 0 0;
}

.brand h1{
  font-family:'Poppins',sans-serif;
  font-weight:300;
  letter-spacing:9px;
  text-transform:uppercase;
  font-size:clamp(28px,7vw,44px);

  margin:0;

  background:
    linear-gradient(
      180deg,
      #3a3d42 0%,
      #202226 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  filter:
    drop-shadow(0 1px 0 rgba(255,255,255,.35));
}

/* =========================
   WHEEL STAGE
========================= */

.stage{
  position:relative;

  width:min(92vw,500px);
  aspect-ratio:1/1;

  margin:35px 0 24px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   REALISTIC POINTER
========================= */

/*
  This replaces the simple CSS triangle.

  It creates:
  - gold top mounting
  - red metal arm
  - red triangular pointer
  - gold outline
  - central screw
  - realistic shadow
*/

.pointer-system{
  position:absolute;

  top:-39px;
  left:50%;

  width:105px;
  height:112px;

  transform:translateX(-50%);

  z-index:20;

  pointer-events:none;

  filter:
    drop-shadow(0 8px 8px rgba(0,0,0,.55));
}

/* Gold mounting bracket */

.pointer-mount{
  position:absolute;

  top:0;
  left:50%;

  width:54px;
  height:35px;

  transform:translateX(-50%);

  border-radius:18px 18px 7px 7px;

  background:
    linear-gradient(
      90deg,
      #8b6113 0%,
      var(--gold-light) 25%,
      #fff0a0 48%,
      var(--gold) 70%,
      #8b6113 100%
    );

  border:2px solid #76500d;

  box-shadow:
    inset 0 3px 3px rgba(255,255,255,.55),
    inset 0 -5px 7px rgba(90,55,0,.45);
}

/* mounting screw */

.pointer-mount::after{
  content:"";

  position:absolute;

  width:13px;
  height:13px;

  border-radius:50%;

  left:50%;
  bottom:5px;

  transform:translateX(-50%);

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff5ae,
      #e7b633 45%,
      #76500d 100%
    );

  border:1px solid #68460a;

  box-shadow:
    0 2px 4px rgba(0,0,0,.5);
}

/* Red metal stem */

.pointer-arm{
  position:absolute;

  top:26px;
  left:50%;

  width:25px;
  height:49px;

  transform:translateX(-50%);

  background:
    linear-gradient(
      90deg,
      #641711 0%,
      #a9281e 20%,
      #e04b3c 48%,
      #a9281e 72%,
      #5e1510 100%
    );

  border-left:2px solid #f16b5d;
  border-right:2px solid #63150f;

  border-radius:4px 4px 0 0;

  box-shadow:
    inset 0 0 5px rgba(255,255,255,.25);
}

/* Actual pointer */

.pointer-tip{
  position:absolute;

  left:50%;
  bottom:0;

  transform:translateX(-50%);

  width:0;
  height:0;

  border-left:39px solid transparent;
  border-right:39px solid transparent;

  border-top:67px solid #6d1812;

  filter:
    drop-shadow(0 3px 2px rgba(0,0,0,.4));
}

/* Inner red face */

.pointer-tip::after{
  content:"";

  position:absolute;

  left:-32px;
  top:-61px;

  width:0;
  height:0;

  border-left:32px solid transparent;
  border-right:32px solid transparent;

  border-top:56px solid #d83b2f;
}

/* Pointer highlight */

.pointer-tip::before{
  content:"";

  position:absolute;

  left:-20px;
  top:-53px;

  width:0;
  height:0;

  border-left:20px solid transparent;
  border-right:20px solid transparent;

  border-top:35px solid rgba(255,120,105,.42);

  z-index:2;
}

/* =========================
   OUTER GOLD RING
========================= */

.ring{
  position:absolute;

  inset:0;

  border-radius:50%;

  padding:11px;

  background:
    linear-gradient(
      135deg,
      #7d5912 0%,
      #ffd966 13%,
      #b17d1e 28%,
      #ffe37d 46%,
      #9a6c16 67%,
      #f5ca4e 85%,
      #74500e 100%
    );

  box-shadow:
    0 18px 45px rgba(0,0,0,.65),
    inset 0 0 0 2px rgba(255,255,255,.25),
    inset 0 0 20px rgba(73,42,0,.6);
}

/* Dark inner border */

.ring::before{
  content:"";

  position:absolute;

  inset:13px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #070a19 0%,
      #070a19 72%,
      #02030a 100%
    );

  box-shadow:
    inset 0 0 15px rgba(0,0,0,.9);

  z-index:1;
}

/* =========================
   LIGHT BULBS
========================= */

.bulbs{
  position:absolute;

  inset:3px;

  border-radius:50%;

  z-index:6;

  pointer-events:none;
}

.bulb{
  position:absolute;

  width:13px;
  height:13px;

  border-radius:50%;

  transform:translate(-50%,-50%);

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffffff 0%,
      #fffbd8 25%,
      #ffd85c 60%,
      #b47a15 100%
    );

  box-shadow:
    0 0 7px rgba(255,223,103,.95),
    0 0 15px rgba(255,202,54,.45);

  border:1px solid #fff0a2;
}

/* =========================
   WHEEL CANVAS
========================= */

canvas{
  position:absolute;

  inset:25px;

  width:calc(100% - 50px);
  height:calc(100% - 50px);

  border-radius:50%;

  z-index:2;

  transition:
    transform 5.6s cubic-bezier(.12,.72,.12,1);

  box-shadow:
    0 0 0 4px rgba(0,0,0,.35) inset,
    0 0 20px rgba(0,0,0,.4);
}

/* =========================
   CENTER HUB
========================= */

.hub{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:20%;
  aspect-ratio:1/1;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 25%,
      #5a421b 0%,
      #241805 35%,
      #0c0803 75%,
      #000 100%
    );

  border:
    5px solid var(--gold);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:8;

  box-shadow:
    0 7px 15px rgba(0,0,0,.65),
    inset 0 0 8px rgba(255,220,100,.18);
}

.hub::before{
  content:"";

  position:absolute;

  inset:5px;

  border-radius:50%;

  border:1px solid rgba(255,220,100,.35);
}

.hub svg{
  width:45%;
  height:45%;

  fill:var(--gold-light);

  filter:
    drop-shadow(0 0 7px rgba(255,213,87,.8));
}

/* =========================
   SPIN BUTTON
========================= */

.spin-btn{
  position:relative;

  appearance:none;
  border:none;

  cursor:pointer;

  font-family:'Poppins',sans-serif;
  font-weight:600;

  font-size:15px;
  text-transform:uppercase;
  letter-spacing:4px;

  color:#f1e2b8;

  padding:18px 60px;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #35373c 0%,
      #1b1c1f 100%
    );

  border:1px solid rgba(232,185,59,.5);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 14px 30px rgba(0,0,0,.35);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.spin-btn:hover{
  transform:translateY(-2px);

  border-color:var(--gold-light);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 18px 36px rgba(0,0,0,.4),
    0 0 20px rgba(232,185,59,.22);
}

.spin-btn:active{
  transform:scale(.97);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 8px 18px rgba(0,0,0,.35);
}

.spin-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =========================
   RESULT POPUP + CONFETTI
========================= */

.result-overlay{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:30;

  pointer-events:none;
}

.confetti-layer{
  position:absolute;
  inset:0;
  overflow:visible;
}

.confetti-piece{
  position:absolute;
  top:50%;
  left:50%;

  font-size:24px;
  line-height:1;

  opacity:0;

  transform:translate(-50%,-50%);

  will-change:transform,opacity;
}

.confetti-piece.burst{
  animation: confettiBurst 1.1s ease-out forwards;
}

@keyframes confettiBurst{
  0%{
    transform:
      translate(-50%,-50%)
      translate(0,0)
      rotate(0deg)
      scale(1);
    opacity:1;
  }
  100%{
    transform:
      translate(-50%,-50%)
      translate(var(--dx), var(--dy))
      rotate(var(--rot))
      scale(.5);
    opacity:0;
  }
}

.popup-card{
  position:relative;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;

  padding:26px 34px;

  border-radius:16px;

  background:
    linear-gradient(
      180deg,
      rgba(30,31,35,.96),
      rgba(16,17,20,.96)
    );

  border:1px solid rgba(232,185,59,.5);

  box-shadow:
    0 20px 45px rgba(0,0,0,.45);

  opacity:0;
  transform:scale(.92) translateY(6px);

  max-width:80%;

  text-align:center;
}

.popup-card.show{
  animation: popIn .5s cubic-bezier(.22,1,.36,1) forwards;
}

.popup-card.hide{
  animation: popOut .3s ease-in forwards;
}

@keyframes popIn{
  0%{ opacity:0; transform:scale(.9) translateY(8px); }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}

@keyframes popOut{
  0%{ opacity:1; transform:scale(1) translateY(0); }
  100%{ opacity:0; transform:scale(.94) translateY(-4px); }
}

.popup-emoji{
  font-size:34px;
  line-height:1;
}

.popup-text{
  font-family:'Poppins',sans-serif;
  font-weight:600;
  letter-spacing:.3px;
  font-size:16px;
  color:#f1ede4;
}

.popup-card.jackpot{
  border-color:var(--gold-light);
  box-shadow:
    0 0 30px rgba(255,215,106,.3),
    0 20px 45px rgba(0,0,0,.45);
}

.popup-card.badluck{
  border-color:rgba(157,180,255,.5);
}

.popup-card.badluck .popup-text{
  color:#c3cdf5;
}

/* =========================
   NAME / NUMBER MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;

  background:rgba(10,11,13,.72);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  opacity:0;
  visibility:hidden;

  transition:
    opacity .25s ease,
    visibility 0s linear .25s;

  z-index:100;
}

.modal-overlay.show{
  opacity:1;
  visibility:visible;

  transition:
    opacity .25s ease,
    visibility 0s linear 0s;
}

.modal-card{
  width:100%;
  max-width:340px;

  background:
    linear-gradient(
      180deg,
      #2c2e33 0%,
      #1a1b1e 100%
    );

  border:1px solid rgba(232,185,59,.5);

  border-radius:18px;

  padding:28px 24px;

  box-shadow:
    0 24px 55px rgba(0,0,0,.5);

  transform:scale(.92) translateY(10px);
  opacity:0;

  transition:
    transform .25s cubic-bezier(.22,1,.36,1),
    opacity .25s ease;
}

.modal-overlay.show .modal-card{
  transform:scale(1) translateY(0);
  opacity:1;
}

.modal-title{
  margin:0 0 2px;
  text-align:center;

  font-family:'Poppins',sans-serif;
  font-weight:600;
  font-size:16px;
  color:#f1ede4;
}

.modal-subtitle{
  margin:0 0 18px;
  text-align:center;

  font-size:13px;
  color:var(--muted);
}

.modal-input{
  display:block;
  width:100%;

  padding:13px 16px;

  margin-bottom:12px;

  border-radius:10px;

  border:1px solid rgba(232,185,59,.3);

  background:rgba(0,0,0,.28);

  color:#f1ede4;

  font-family:'Poppins',sans-serif;
  font-size:14px;

  outline:none;

  transition:border-color .15s ease;
}

.modal-input::placeholder{
  color:#8a8d93;
}

.modal-input:focus{
  border-color:var(--gold-light);
}

.modal-error{
  min-height:16px;
  margin:0 0 8px;

  font-size:12px;
  color:#e0665a;
  text-align:center;
}

.modal-done-btn{
  appearance:none;
  border:none;
  cursor:pointer;
  width:100%;

  padding:14px;

  border-radius:10px;

  font-family:'Poppins',sans-serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;

  color:#241505;

  background:
    linear-gradient(
      180deg,
      var(--gold-light),
      var(--gold)
    );

  transition:transform .12s ease;
}

.modal-done-btn:active{
  transform:scale(.97);
}

/* =========================
   FOOTER
========================= */

footer{
  margin-top:38px;

  font-size:12px;

  color:var(--muted);

  text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:520px){

  body{
    padding-top:22px;
  }

  .stage{
    width:min(94vw,460px);
    margin-top:32px;
  }

  .pointer-system{
    transform:translateX(-50%) scale(.86);
    transform-origin:bottom center;
    top:-35px;
  }

  .bulb{
    width:10px;
    height:10px;
  }

  .spin-btn{
    padding:16px 40px;
    font-size:13px;
    letter-spacing:3px;
  }

  .popup-card{
    padding:18px 22px;
  }

  .popup-emoji{
    font-size:32px;
  }

  .popup-text{
    font-size:16px;
  }
}

@media(prefers-reduced-motion:reduce){

  canvas{
    transition:none;
  }
}
</style>
</head>

<body>

<!-- =========================
     BRAND
========================= -->

<div class="brand">

  <h1>
    CHIMNEY
  </h1>

  <p class="kicker">
    roasting &amp; beans
  </p>

  <p class="offer">
    আপনার জন্য বিশেষ অফার
  </p>

</div>


<!-- =========================
     WHEEL
========================= -->

<div class="stage">

  <!-- REALISTIC POINTER -->

  <div class="pointer-system">

    <div class="pointer-mount"></div>

    <div class="pointer-arm"></div>

    <div class="pointer-tip"></div>

  </div>


  <!-- GOLD RING -->

  <div class="ring">

    <!-- Bulbs are generated by JS -->

    <div class="bulbs" id="bulbs"></div>

    <canvas
      id="wheel"
      width="600"
      height="600">
    </canvas>

  </div>


  <!-- CENTER HUB -->

  <div class="hub">

    <svg viewBox="0 0 24 24">
      <path d="
        M12 2
        l2.9 6.3
        L21 9
        l-5 4.6
        L17.4 21
        12 17.3
        6.6 21
        8 13.6
        3 9
        l6.1-.7
        L12 2z
      "/>
    </svg>

  </div>


  <!-- RESULT POPUP (bursts up over the wheel, like a jackpot celebration) -->

  <div class="result-overlay" id="resultOverlay">

    <div class="confetti-layer" id="confettiLayer"></div>

    <div class="popup-card" id="popupCard">
      <span class="popup-emoji" id="popupEmoji"></span>
      <span class="popup-text" id="popupText"></span>
    </div>

  </div>

</div>


<!-- =========================
     BUTTON
========================= -->

<button
  class="spin-btn"
  id="spinBtn">

  START

</button>


<!-- =========================
     NAME / NUMBER MODAL
========================= -->

<div class="modal-overlay" id="nameModal">

  <div class="modal-card">

    <p class="modal-title">
      চরকা ঘোরানোর আগে
    </p>

    <p class="modal-subtitle">
      আপনার নাম ও নাম্বার দিন
    </p>

    <input
      type="text"
      id="customerNameInput"
      class="modal-input"
      placeholder="আপনার নাম"
      autocomplete="off"
    >

    <input
      type="tel"
      id="customerNumberInput"
      class="modal-input"
      placeholder="মোবাইল নাম্বার"
      inputmode="numeric"
      autocomplete="off"
    >

    <p class="modal-error" id="modalError"></p>

    <button
      class="modal-done-btn"
      id="nameDoneBtn">
      Done
    </button>

  </div>

</div>


<footer>
  CHIMNEY • Roasting & Beans
</footer>


<script>

(function(){

/* =========================================
   SEGMENTS
========================================= */

const segments = [

  {
    label:'50%\nHIGHLIGHT',
    fill:'#b91c1c',
    text:'#ffffff',
    weight:0,
    type:'discount',
    accent:true
  },

  {
    label:'15%',
    fill:'#6c3fa0',
    text:'#ffffff',
    weight:12,
    type:'discount'
  },

  {
    label:'20%',
    fill:'#d9711f',
    text:'#ffffff',
    weight:8,
    type:'discount'
  },

  {
    label:'25%',
    fill:'#1e7a3d',
    text:'#ffffff',
    weight:5,
    type:'discount'
  },

  {
    label:'100%\nJACKPOT',
    fill:'#b91c1c',
    text:'#ffd76a',
    weight:0,
    type:'jackpot'
  },

  {
    label:'5%',
    fill:'#c22a72',
    text:'#ffffff',
    weight:16,
    type:'discount'
  },

  {
    label:'10%',
    fill:'#0e7c7b',
    text:'#ffffff',
    weight:16,
    type:'discount'
  },

  {
    label:'15%',
    fill:'#1f4fa0',
    text:'#ffffff',
    weight:12,
    type:'discount'
  },

  {
    label:'BAD\nLUCK',
    fill:'#b91c1c',
    text:'#ffffff',
    weight:0,
    type:'badluck'
  },

  {
    label:'15%',
    fill:'#1e7a3d',
    text:'#ffffff',
    weight:12,
    type:'discount'
  },

  {
    label:'10%',
    fill:'#6c3fa0',
    text:'#ffffff',
    weight:16,
    type:'discount'
  },

  {
    label:'5%',
    fill:'#b8860b',
    text:'#ffffff',
    weight:16,
    type:'discount'
  }

];


/* =========================================
   CANVAS
========================================= */

const canvas =
  document.getElementById('wheel');

const ctx =
  canvas.getContext('2d');

const N =
  segments.length;

const arc =
  (Math.PI * 2) / N;

const radius =
  canvas.width / 2;


/* =========================================
   DRAW WHEEL
========================================= */

function drawWheel(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  for(let i=0;i<N;i++){

    const start =
      i * arc - Math.PI/2;

    const end =
      start + arc;

    const seg =
      segments[i];


    /* SLICE */

    ctx.beginPath();

    ctx.moveTo(
      radius,
      radius
    );

    ctx.arc(
      radius,
      radius,
      radius,
      start,
      end
    );

    ctx.closePath();

    ctx.fillStyle =
      seg.fill;

    ctx.fill();


    /* HIGHLIGHT */

    if(seg.accent){

      const grad =
        ctx.createRadialGradient(
          radius,
          radius,
          radius*.12,
          radius,
          radius,
          radius
        );

      grad.addColorStop(
        0,
        'rgba(255,255,255,.45)'
      );

      grad.addColorStop(
        .45,
        'rgba(255,255,255,.12)'
      );

      grad.addColorStop(
        1,
        'rgba(255,255,255,0)'
      );

      ctx.fillStyle =
        grad;

      ctx.fill();

    }


    /* SEPARATOR */

    ctx.strokeStyle =
      'rgba(0,0,0,.28)';

    ctx.lineWidth = 3;

    ctx.stroke();


    /* LABEL */

    ctx.save();

    ctx.translate(
      radius,
      radius
    );

    ctx.rotate(
      start + arc/2
    );

    ctx.textAlign =
      'right';

    ctx.textBaseline =
      'middle';

    ctx.fillStyle =
      seg.text;


    const lines =
      seg.label.split('\n');


    let fontSize;

    if(seg.type === 'jackpot'){
      fontSize =
        radius * .070;
    }
    else if(seg.accent){
      fontSize =
        radius * .092;
    }
    else if(seg.type === 'badluck'){
      fontSize =
        radius * .072;
    }
    else{
      fontSize =
        radius * .115;
    }


    ctx.font =
      `800 ${fontSize}px 'Baloo 2', sans-serif`;


    /* TEXT SHADOW */

    ctx.shadowColor =
      'rgba(0,0,0,.45)';

    ctx.shadowBlur = 3;

    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 2;


    const lineHeight =
      fontSize * 1.03;


    const startY =
      -((lines.length-1)*lineHeight)/2;


    lines.forEach(
      (line,li)=>{

        ctx.fillText(
          line,
          radius*.90,
          startY + li*lineHeight
        );

      }
    );


    ctx.restore();

  }

}

/* =========================================
   WEIGHTED RANDOM
========================================= */

function pickIndex(){

  const total =
    segments.reduce(
      (sum,seg)=>
        sum + seg.weight,
      0
    );


  let random =
    Math.random() * total;


  for(let i=0;i<N;i++){

    random -=
      segments[i].weight;


    if(random <= 0){
      return i;
    }

  }


  return N-1;

}

/* =========================================

========================================= */

function playTick(){

  try{

    const audio =
      playTick.ctx ||
      (
        playTick.ctx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )()
      );


    const oscillator =
      audio.createOscillator();


    const gain =
      audio.createGain();


    oscillator.type =
      'square';


    oscillator.frequency.value =
      700;


    gain.gain.value =
      .035;


    oscillator.connect(gain);

    gain.connect(
      audio.destination
    );


    oscillator.start();


    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audio.currentTime + .07
    );


    oscillator.stop(
      audio.currentTime + .08
    );

  }
  catch(e){}

}

/* =========================================
   EASING (matches the canvas CSS transition
   cubic-bezier(.12,.72,.12,1), so tick sounds
   can be paced to match the wheel's actual
   on-screen speed instead of a fixed interval)
========================================= */

function makeBezierEase(p1x, p1y, p2x, p2y){

  function A(a1,a2){ return 1 - 3*a2 + 3*a1; }
  function B(a1,a2){ return 3*a2 - 6*a1; }
  function C(a1){ return 3*a1; }

  function calcBezier(t,a1,a2){
    return ((A(a1,a2)*t + B(a1,a2))*t + C(a1))*t;
  }

  function getSlope(t,a1,a2){
    return 3*A(a1,a2)*t*t + 2*B(a1,a2)*t + C(a1);
  }

  function getTForX(x){
    let t = x;
    for(let i=0;i<8;i++){
      const slope = getSlope(t,p1x,p2x);
      if(Math.abs(slope) < 1e-6) break;
      t -= (calcBezier(t,p1x,p2x) - x) / slope;
    }
    return t;
  }

  return function(x){
    if(x<=0) return 0;
    if(x>=1) return 1;
    return calcBezier(getTForX(x), p1y, p2y);
  };

}

const wheelEase =
  makeBezierEase(.12,.72,.12,1);

/* =========================================
   SPIN
========================================= */

function startSpin(){

  {

    if(spinning)
      return;


    spinning = true;

    spinBtn.disabled =
      true;


    popupCard.classList.remove(
      'show',
      'hide',
      'jackpot',
      'badluck'
    );

    popupCard.style.opacity =
      '0';

    confettiLayer.innerHTML =
      '';


    /* RANDOM RESULT */

    const targetIndex =
      pickIndex();


    const segAngle =
      360 / N;


    /*
      Center angle measured clockwise
      from 12 o'clock.
    */

    const targetCenterAngle =
      targetIndex * segAngle +
      segAngle/2;


    /*
      Random landing position
    */

    const jitter =
      (Math.random()-.5) *
      segAngle *
      .45;


    /*
      6-8 complete rotations
    */

    const extraSpins =
      6 +
      Math.floor(
        Math.random()*3
      );


    /*
      Cancel out whatever leftover
      angle the previous spin ended on,
      so this spin's math starts clean.
    */

    const normalizedCurrent =
      ((currentRotation % 360) + 360) % 360;


    /*
      Rotate wheel so target
      comes under pointer.
    */

    const finalAngle =
      extraSpins * 360 -
      normalizedCurrent -
      targetCenterAngle -
      jitter;


    const spinStartRotation =
      currentRotation;


    currentRotation +=
      finalAngle;

    const spinEndRotation =
      currentRotation;


    canvas.style.transform =
      `rotate(${spinEndRotation}deg)`;


    /*
      TICK SOUND — paced to the wheel's
      actual on-screen speed, not a fixed
      interval. We recompute the wheel's
      current angle every frame using the
      same easing curve as the CSS transition,
      and only fire a tick when a real
      segment boundary is crossed.
    */

    const spinDurationMs = 5600;
    const tickStartTime = performance.now();
    let lastSegCrossed =
      Math.floor(spinStartRotation / segAngle);

    function tickLoop(now){

      const elapsed =
        now - tickStartTime;

      if(elapsed >= spinDurationMs){
        return;
      }

      const progress =
        elapsed / spinDurationMs;

      const eased =
        wheelEase(progress);

      const angleNow =
        spinStartRotation +
        (spinEndRotation - spinStartRotation) * eased;

      const segNow =
        Math.floor(angleNow / segAngle);

      if(segNow !== lastSegCrossed){
        playTick();
        lastSegCrossed = segNow;
      }

      requestAnimationFrame(tickLoop);

    }

    requestAnimationFrame(tickLoop);


    /* FINISH */

    setTimeout(
      ()=>{

        spinning =
          false;


        spinBtn.disabled =
          false;


        const seg =
          segments[targetIndex];


        let emoji;
        let text;
        let extraClass;


        if(seg.type === 'jackpot'){

          emoji =
            '🎉';

          text =

          extraClass =
            'jackpot';

        }

        else if(seg.type === 'badluck'){

          emoji =
            '😔';

          text =
            'এবার হলো না, আবার চেষ্টা করুন';

          extraClass =
            'badluck';

        }

        else{

          const discount =
            seg.label
              .split('\n')[0];

          emoji =
            '🎁';

          text =
            `আপনি পেয়েছেন ${discount} ছাড়!`;

          extraClass =
            null;

        }


        popupEmoji.textContent =
          emoji;

        popupText.textContent =
          text;

        if(extraClass){
          popupCard.classList.add(
            extraClass
          );
        }

        popupCard.classList.remove(
          'hide'
        );

        popupCard.classList.add(
          'show'
        );


        if(seg.type !== 'badluck'){

              discount: seg.label.split('\n')[0]
            })
          }
        ).catch(()=>{});


      },
      5700
    );

  }

}
